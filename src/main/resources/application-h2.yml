####################################
# H2 프로필 : MySQL 없이 실행
#   ./gradlew bootRun --args='--spring.profiles.active=h2'
#   데이터는 프로젝트 폴더의 data/inhaworks.mv.db 파일에 저장된다 (지우면 처음부터)
####################################
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/inhaworks;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
