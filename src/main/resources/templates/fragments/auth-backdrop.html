<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- 로그인 화면 뒤에 흐리게 깔리는 "앱 화면" (관리자 = 대시보드 모양, 직원 = 홈 모양)
     로그인 전이므로 DB 데이터는 쓰지 않는다 : 숫자·이름은 모두 고정 예시이고 대부분 회색 막대(스켈레톤)
     aria-hidden + inert : 화면 읽기 프로그램과 Tab 키가 들어가지 않는다. pointer-events 없음 -->
<div th:fragment="backdrop(kind)" class="auth-backdrop" aria-hidden="true" inert>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark">I</span>InhaWorks</div>
            <nav>
                <div class="nav-group">
                    <div class="nav-label" th:text="${kind == 'admin'} ? '업무' : '우리 회사'">업무</div>
                    <span class="nav-item active"><span class="sk sk-ic"></span><span th:text="${kind == 'admin'} ? '대시보드' : '홈'">대시보드</span></span>
                    <span class="nav-item"><span class="sk sk-ic"></span>할 일</span>
                    <span class="nav-item"><span class="sk sk-ic"></span>보고서</span>
                    <span class="nav-item" th:if="${kind == 'admin'}"><span class="sk sk-ic"></span>결재함</span>
                    <span class="nav-item"><span class="sk sk-ic"></span>게시판</span>
                </div>
                <div class="nav-group">
                    <div class="nav-label">근태</div>
                    <span class="nav-item"><span class="sk sk-ic"></span>출퇴근</span>
                    <span class="nav-item"><span class="sk sk-ic"></span>스케줄</span>
                    <span class="nav-item"><span class="sk sk-ic"></span>휴가</span>
                </div>
                <div class="nav-group" th:if="${kind == 'admin'}">
                    <div class="nav-label">관리</div>
                    <span class="nav-item"><span class="sk sk-ic"></span>재처리 모니터</span>
                    <span class="nav-item"><span class="sk sk-ic"></span>직원·조직</span>
                </div>
            </nav>
        </aside>
        <div class="main">
            <header class="topbar"><span class="crumbs"><span th:text="${kind == 'admin'} ? '관리자' : '우리 회사'">관리자</span><span class="sep">›</span>
                <b th:text="${kind == 'admin'} ? '대시보드' : '홈'">대시보드</b></span></header>
            <div class="content">
                <div class="page-header"><div>
                    <div class="sk sk-line" style="width:120px;margin-bottom:10px"></div>
                    <h2 class="page-title" th:text="${kind == 'admin'} ? '오늘의 운영' : '안녕하세요'">오늘의 운영</h2>
                    <div class="sk sk-line" style="width:260px;margin-top:10px"></div>
                </div></div>

                <!-- 관리자 : 히어로 + KPI + 표 -->
                <th:block th:if="${kind == 'admin'}">
                    <section class="dash-top">
                        <div class="card hero"><span class="label">오늘 할 일 완료율</span>
                            <div class="hero-num">78<small>%</small></div><div class="bar hero-bar"><span style="width:78%"></span></div></div>
                        <div class="card kpi"><span class="label">결재 대기</span><span class="value">3<small>건</small></span></div>
                        <div class="card kpi"><span class="label">출근</span><span class="value">12<small>명</small></span></div>
                    </section>
                    <section class="card flush">
                        <div class="card-head"><h3>근무지별 진행</h3></div>
                        <div class="sk-rows">
                            <div class="sk-row" th:each="i : ${#numbers.sequence(1, 5)}">
                                <span class="sk sk-av"></span><span class="sk sk-line" style="width:22%"></span>
                                <span class="sk sk-bar"><span th:style="|width:${30 + i * 12}%|"></span></span><span class="sk sk-line" style="width:12%"></span>
                            </div>
                        </div>
                    </section>
                </th:block>

                <!-- 직원 : 출퇴근 카드 + 오늘 할 일 + 공지 -->
                <th:block th:unless="${kind == 'admin'}">
                    <section class="grid grid-3">
                        <div class="card kpi"><span class="label">오늘 남은 할 일</span><span class="value">2<small>건</small></span></div>
                        <div class="card kpi"><span class="label">출근</span><span class="value">09:00</span></div>
                        <div class="card kpi"><span class="label">결재 대기</span><span class="value">1<small>건</small></span></div>
                    </section>
                    <section class="card flush">
                        <div class="card-head"><h3>오늘 할 일</h3></div>
                        <div class="sk-rows">
                            <div class="sk-row" th:each="i : ${#numbers.sequence(1, 4)}">
                                <span class="sk sk-check"></span><span class="sk sk-line" th:style="|width:${30 + i * 8}%|"></span>
                                <span class="sk sk-chip"></span>
                            </div>
                        </div>
                    </section>
                    <section class="card flush">
                        <div class="card-head"><h3>공지</h3></div>
                        <div class="sk-rows">
                            <div class="sk-row" th:each="i : ${#numbers.sequence(1, 3)}"><span class="sk sk-chip"></span><span class="sk sk-line" style="width:55%"></span><span class="sk sk-line" style="width:10%"></span></div>
                        </div>
                    </section>
                </th:block>
            </div>
        </div>
    </div>
</div>
</html>
