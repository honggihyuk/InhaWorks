<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>문의 주제</title></head>
<body>
<nav layout:fragment="crumbs" class="crumbs" aria-label="현재 위치"><span>관리자</span><span class="sep">›</span><a th:href="@{/admin/chat}">채팅</a><span class="sep">›</span><b>문의 주제</b></nav>

<main layout:fragment="content" class="content">
    <div class="page-header"><div>
        <h1 class="page-title">문의 주제</h1>
        <p class="page-sub">직원이 ‘관리자와 채팅하기’에서 고르는 주제와 담당자를 정해요</p>
    </div></div>
    <div th:replace="~{admin/chat-tabs :: tabs('topics')}"></div>

    <section class="card">
        <div class="card-head"><h2 th:text="${inquiryTopicForm.id != null} ? '주제 고치기' : '새 주제'">새 주제</h2>
            <a class="btn sm ghost" th:if="${inquiryTopicForm.id != null}" th:href="@{/admin/chat/topics}">새로 만들기</a></div>
        <form th:action="@{/admin/chat/topics}" th:object="${inquiryTopicForm}" method="post" class="stack" style="gap:12px" data-once>
            <input type="hidden" th:field="*{id}">
            <div class="alert error" th:if="${#fields.hasAnyErrors()}" role="alert"><div th:each="e : ${#fields.allErrors()}" th:text="${e}">오류</div></div>
            <div class="grid grid-2">
                <div class="field"><label for="name">이름</label><input class="input" th:field="*{name}" maxlength="50" required placeholder="예) 인사 문의"></div>
                <div class="field"><label for="icon">아이콘 (이모지)</label><input class="input" th:field="*{icon}" maxlength="4" placeholder="💬"></div>
            </div>
            <div class="field"><label for="description">설명</label><input class="input" th:field="*{description}" maxlength="200" placeholder="예) 급여, 휴가, 출퇴근"></div>
            <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label">담당자 (관리자·매니저)</legend>
                <div class="chat-people" style="max-height:200px">
                    <label class="chat-person" th:each="h : ${handlers}">
                        <input type="checkbox" name="handlerIds" th:value="${h.id}" th:checked="${#lists.contains(inquiryTopicForm.handlerIds, h.id)}">
                        <span th:replace="~{fragments/ui :: avatar(${h}, 'sm')}"></span>
                        <span class="chat-person-text"><b th:text="${h.displayName}">이름</b><small th:text="${h.role?.label}">매니저</small></span>
                    </label>
                </div>
            </fieldset>
            <label class="row" style="gap:8px"><input type="checkbox" th:field="*{active}"> 사용</label>
            <div class="row" style="justify-content:flex-end"><button type="submit" class="btn primary">저장</button></div>
        </form>
    </section>

    <section class="card flush">
        <div class="card-head"><h2>주제 목록</h2></div>
        <div th:if="${#lists.isEmpty(topics)}" class="empty-sm" style="padding:18px 22px">아직 주제가 없어요.</div>
        <div class="table-box" th:unless="${#lists.isEmpty(topics)}" style="margin-top:8px">
            <table class="t">
                <thead><tr><th>주제</th><th>담당자</th><th>사용</th><th class="right"></th></tr></thead>
                <tbody>
                <tr th:each="t : ${topics}" th:classappend="${t.active} ? '' : 'dim'">
                    <td class="cell-title"><b th:text="|${t.icon != null ? t.icon + ' ' : ''}${t.name}|">인사 문의</b>
                        <span class="sub" th:text="${t.description}">설명</span></td>
                    <td class="muted"><th:block th:each="h, st : ${t.handlers}" th:text="${h.displayName + (st.last ? '' : ', ')}">김민수</th:block></td>
                    <td><span class="chip" th:classappend="${t.active} ? 'blue' : 'grey'" th:text="${t.active} ? '사용' : '중지'">사용</span></td>
                    <td class="right nowrap"><a class="btn sm" th:href="@{/admin/chat/topics(edit=${t.id})}">고치기</a>
                        <form th:action="@{|/admin/chat/topics/${t.id}/toggle|}" method="post" class="inline">
                            <button type="submit" class="btn sm ghost" th:text="${t.active} ? '사용 중지' : '다시 사용'">사용 중지</button></form></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
