<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>게시판 관리</title></head>
<body>
<nav layout:fragment="crumbs" class="crumbs" aria-label="현재 위치"><span>관리자</span><span class="sep">›</span><a th:href="@{/board}">게시판</a><span class="sep">›</span><b>게시판 관리</b></nav>

<main layout:fragment="content" class="content">
    <div class="page-header">
        <div>
            <h1 class="page-title">게시판 관리</h1>
            <p class="page-sub">일반 / 이슈 &amp; 해결 게시판, 주제별·팀 전용 게시판을 만들어요</p>
        </div>
        <div class="actions"><a th:href="@{/board}" class="btn">게시판 보기</a></div>
    </div>

    <section class="card">
        <div class="card-head"><h2>새 게시판</h2></div>
        <form th:action="@{/admin/board}" method="post" class="form-grid" style="align-items:end">
            <div class="field"><label for="bname">이름</label><input id="bname" type="text" name="name" class="input" required maxlength="50" placeholder="예: 영업 노하우"></div>
            <div class="field"><label for="bdesc">설명</label><input id="bdesc" type="text" name="description" class="input" maxlength="200"></div>
            <div class="field"><label for="btype">종류</label>
                <select id="btype" name="type" class="select"><option th:each="t : ${types}" th:value="${t}" th:text="${t.label}">일반</option></select></div>
            <div class="field"><label for="bteam">볼 수 있는 사람</label>
                <select id="bteam" name="teamId" class="select">
                    <option value="">전 직원</option>
                    <option th:each="t : ${teams}" th:value="${t.id}" th:text="|${t.name} 전용|">영업팀</option>
                </select></div>
            <button type="submit" class="btn primary">만들기</button>
        </form>
    </section>

    <section class="card flush">
        <div class="table-box">
            <table class="t">
                <thead><tr><th>게시판</th><th>종류</th><th>볼 수 있는 사람</th><th class="right">글</th><th class="right"></th></tr></thead>
                <tbody>
                <tr th:if="${#maps.isEmpty(boards)}"><td colspan="5" class="empty-sm">게시판이 없어요.</td></tr>
                <tr th:each="e : ${boards}" th:with="b=${e.key}">
                    <td><a class="title-cell" th:href="@{|/board/${b.id}|}" th:text="${b.name}">사내 공지</a>
                        <span class="sub" th:text="${b.description}">설명</span></td>
                    <td><span class="chip" th:classappend="${b.issueBoard} ? 'blue' : 'grey'" th:text="${b.type.label}">일반</span></td>
                    <td th:text="${b.team != null ? b.team.name + ' 전용' : '전 직원'}">전 직원</td>
                    <td class="right tnum" th:text="${e.value}">3</td>
                    <td class="right">
                        <form th:action="@{|/admin/board/${b.id}/delete|}" method="post" class="inline">
                            <button type="submit" class="btn sm danger" th:attr="data-confirm=|‘${b.name}’ 게시판을 삭제할까요?|"
                                    data-confirm-body="글이 있으면 지울 수 없어요. 되돌릴 수 없어요." data-confirm-ok="삭제" data-danger>삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
