<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>인사 서류 설정</title></head>
<body>
<nav layout:fragment="crumbs" class="crumbs" aria-label="현재 위치"><span>관리자</span><span class="sep">›</span><a th:href="@{/admin/members}">직원·조직</a><span class="sep">›</span><b>인사 서류</b></nav>

<main layout:fragment="content" class="content">
    <div class="page-header">
        <div>
            <h1 class="page-title">직원 · 조직</h1>
            <p class="page-sub">입·퇴사 때 받아야 할 서류를 정하고, 서류마다 열람 권한을 정해요</p>
        </div>
    </div>

    <nav class="segmented" aria-label="직원·조직">
        <a th:href="@{/admin/members}">직원</a>
        <a th:href="@{/admin/org}">팀 · 근무지</a>
        <a th:href="@{/admin/hr/doc-types}" class="active" aria-current="page">인사 서류</a>
    </nav>

    <section class="card flush">
        <div class="card-head"><h2>서류 종류</h2><span class="meta">필수 서류를 안 낸 직원은 직원 목록과 직원 정보에 빨갛게 표시돼요</span></div>
        <div class="table-box">
            <table class="t">
                <thead><tr><th>서류</th><th>필수</th><th>열람 권한</th><th>직원 제출</th><th class="right">받은 수</th><th class="right"><span class="sr-only">메뉴</span></th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(types)}"><td colspan="6" class="empty-sm">서류 종류가 없어요.</td></tr>
                <tr th:each="t : ${types}" th:classappend="${t.active} ? '' : 'dim'">
                    <td><b th:text="${t.name}">통장 사본</b><span class="sub" th:if="${t.description}" th:text="${t.description}">설명</span>
                        <span class="chip grey" th:unless="${t.active}">사용 중지</span></td>
                    <td data-label=""><span th:if="${t.required}" class="chip outline">필수</span><span th:unless="${t.required}" class="faint">선택</span></td>
                    <td><span class="chip" th:classappend="${t.scope.name() == 'ADMIN_ONLY'} ? 'red' : 'grey'" th:text="${t.scope.label}">본인 · 관리자</span></td>
                    <td th:text="${t.employeeUpload} ? '직원이 직접 제출' : '관리자만 올림'">직원이 직접 제출</td>
                    <td class="right tnum" th:text="|${counts[t.id]} / ${activeCount}|">2 / 4</td>
                    <td class="right">
                        <div class="menu-wrap">
                            <button type="button" class="icon-btn" data-menu-trigger aria-haspopup="menu" aria-expanded="false" th:aria-label="|${t.name} 메뉴|">
                                <th:block th:replace="~{fragments/ui :: icon('more')}"/></button>
                            <div class="menu" role="menu">
                                <a role="menuitem" th:href="|#edit-${t.id}|">고치기</a>
                                <form th:action="@{|/admin/hr/doc-types/${t.id}/toggle|}" method="post">
                                    <button th:if="${t.active}" type="submit" role="menuitem" class="danger"
                                            th:attr="data-confirm=|‘${t.name}’을 사용 중지할까요?|"
                                            data-confirm-body="목록과 필수 서류 확인에서 빠져요. 이미 받은 서류는 지우지 않아요." data-confirm-ok="사용 중지" data-danger>사용 중지…</button>
                                    <button th:unless="${t.active}" type="submit" role="menuitem">다시 사용</button>
                                </form>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <!-- 고치기 (목록의 ⋯ → 고치기 로 이동) -->
    <section class="card" th:each="t : ${types}" th:id="|edit-${t.id}|" data-target-show>
        <div class="card-head"><h2 th:text="|${t.name} 고치기|">고치기</h2></div>
        <form th:action="@{|/admin/hr/doc-types/${t.id}|}" method="post" class="stack">
            <th:block th:replace="~{admin/hr-doc-type-fields :: fields(${t})}"/>
            <div class="row" style="justify-content:flex-end"><a href="#" class="btn">닫기</a><button type="submit" class="btn primary">저장</button></div>
        </form>
    </section>

    <section class="card">
        <div class="card-head"><h2>새 서류 종류</h2></div>
        <form th:action="@{/admin/hr/doc-types}" method="post" class="stack" data-once>
            <th:block th:replace="~{admin/hr-doc-type-fields :: fields(null)}"/>
            <div class="row" style="justify-content:flex-end"><button type="submit" class="btn primary">추가</button></div>
        </form>
    </section>

</main>
</body>
</html>
