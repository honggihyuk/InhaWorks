<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>스케줄 캘린더</title></head>
<body>
<nav layout:fragment="crumbs" class="crumbs" aria-label="현재 위치"><span>관리자</span><span class="sep">›</span><span>스케줄</span><span class="sep">›</span><b>캘린더</b></nav>

<main layout:fragment="content" class="content" th:with="period=${#strings.toString(cal.month())}">
    <div class="page-header">
        <div>
            <h1 class="page-title">스케줄</h1>
            <p class="page-sub" th:text="|${#temporals.format(cal.month().atDay(1), 'yyyy년 M월')} · 근무 ${cal.total()}건|">2026년 11월</p>
        </div>
        <div class="actions">
            <a th:href="@{/admin/schedule/month(month=${cal.prev()}, who=${who}, policy=${policy?.id}, shift=${shift}, memberId=${form.memberId})}" class="btn">‹ 지난달</a>
            <a th:href="@{/admin/schedule/month(who=${who}, policy=${policy?.id}, shift=${shift}, memberId=${form.memberId})}" class="btn">이번 달</a>
            <a th:href="@{/admin/schedule/month(month=${cal.next()}, who=${who}, policy=${policy?.id}, shift=${shift}, memberId=${form.memberId})}" class="btn">다음 달 ›</a>
        </div>
    </div>

    <nav th:replace="~{admin/schedule-bar :: tabs('month', ${period})}"></nav>
    <section th:replace="~{admin/schedule-bar :: card('month', ${period})}"></section>

    <div class="row" style="justify-content:space-between">
        <nav class="segmented" aria-label="보기">
            <a th:href="@{/admin/schedule(week=${cal.month().atDay(1)}, policy=${policy?.id}, memberId=${form.memberId})}">리스트</a>
            <a th:href="@{/admin/schedule/month(month=${cal.month()}, policy=${policy?.id}, memberId=${form.memberId})}" class="active" aria-current="page">캘린더</a>
        </nav>
        <a th:href="@{/admin/schedule/policies}" class="link-muted">근무제 관리 ›</a>
    </div>

    <section th:replace="~{admin/schedule-form :: form('month', ${who})}"></section>

    <section class="card flush">
        <div class="card-head">
            <h2>캘린더</h2>
            <form th:action="@{/admin/schedule/month}" method="get" class="row" style="gap:6px">
                <input type="hidden" name="month" th:value="${cal.month()}">
                <input type="hidden" name="policy" th:value="${policy?.id}">
                <input type="hidden" name="shift" th:value="${shift}">
                <input type="hidden" name="memberId" th:value="${form.memberId}">
                <label class="sr-only" for="who">볼 직원</label>
                <select id="who" name="who" class="select" style="min-height:32px;padding:4px 10px" onchange="this.form.submit()">
                    <option value="">전체 직원</option>
                    <option th:each="m : ${members}" th:if="${policy == null or (m.workPolicy != null and m.workPolicy.id == policy.id)}"
                            th:value="${m.id}" th:selected="${who == m.id}" th:text="${m.displayName}">이서연</option>
                </select>
            </form>
        </div>
        <div class="table-box scroll-x" style="margin-top:12px">
            <table class="month-cal">
                <thead><tr><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th><th>일</th></tr></thead>
                <tbody>
                <tr th:each="week : ${cal.weeks()}">
                    <td th:each="d : ${week}" th:classappend="|${d.inMonth() ? '' : 'out'} ${d.today() ? 'today' : ''}|">
                        <div class="dnum">
                            <span th:text="${d.date().dayOfMonth}">1</span>
                            <button type="button" class="pick" th:attr="data-pick-date=${d.date()}"
                                    th:aria-label="|${#temporals.format(d.date(), 'M월 d일')}로 배정|" title="이 날짜로 배정">+</button>
                        </div>
                        <!-- 근무 유형별 색 블록 : 이름 · 시각 · 인원, 아래에 사람 -->
                        <div class="shift-block" th:each="g : ${d.groups()}" th:classappend="${g.toneCss()}">
                            <div class="sb-head"><b th:text="${g.label()}">오픈</b><span class="tnum" th:text="${g.count()}">2</span></div>
                            <div class="sb-time tnum" th:unless="${g.off()}" th:text="${g.timeText()}">06:00–12:00</div>
                            <div class="sb-people">
                                <span class="sb-person" th:each="s : ${g.schedules()}">
                                    <span th:text="${s.member.displayName}">류다빈</span>
                                    <form th:action="@{|/admin/schedule/${s.id}/delete|}" method="post" class="inline">
                                        <input type="hidden" name="month" th:value="${cal.month()}">
                                        <input type="hidden" name="who" th:value="${who}">
                                        <input type="hidden" name="policy" th:value="${policy?.id}">
                                        <input type="hidden" name="shift" th:value="${shift}">
                                        <button type="submit" th:aria-label="|${s.member.displayName} ${g.label()} 근무 지우기|"
                                                data-confirm="이 근무를 지울까요?" data-confirm-ok="지우기" data-danger>×</button>
                                    </form>
                                </span>
                            </div>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
