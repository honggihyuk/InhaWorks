<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>관리자 로그인 · InhaWorks</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<!-- 관리자 로그인 : POST /admin/login 은 관리자용 SecurityFilterChain 이 처리한다 -->
<body class="ui auth-page">
<!-- 뒤 : 앱 화면 모양(정적 예시) → 위 : 흐림 막(backdrop-filter) → 가운데 : 로그인 카드 -->
<div th:replace="~{fragments/auth-backdrop :: backdrop('admin')}"></div>
<div class="auth-scrim">
<main class="auth-card" aria-labelledby="auth-title">
    <div class="brand"><span class="brand-mark">I</span>InhaWorks <span class="chip blue">관리자</span></div>
    <h1 class="auth-title" id="auth-title">관리자 로그인</h1>
    <p class="muted">관리자 계정으로만 들어갈 수 있어요</p>

    <div th:if="${param.error}" class="alert danger" role="alert">관리자ID 또는 비밀번호를 확인해 주세요.</div>
    <!-- 이용자 계정으로 /admin 에 들어온 경우 : SecurityConfig 의 accessDeniedPage -->
    <div th:if="${param.denied}" class="alert danger" role="alert">관리자 권한이 없는 계정입니다. 관리자 계정으로 로그인해 주세요.</div>
    <div th:if="${param.wrongPage}" class="alert danger" role="alert">직원 계정은 직원 로그인에서 로그인해 주세요.
        <a th:href="@{/member/login}" class="link">직원 로그인 ›</a></div>
    <div th:if="${param.logout}" class="alert info" role="status">로그아웃되었습니다.</div>

    <form th:action="@{/admin/login}" method="post" class="stack" style="gap:14px">
        <div class="field"><label for="username">관리자ID</label>
            <input type="text" name="username" id="username" class="input" autocomplete="section-admin username" required autofocus></div>
        <div class="field"><label for="password">비밀번호</label>
            <input type="password" name="password" id="password" class="input" autocomplete="section-admin current-password" required></div>
        <button type="submit" class="btn primary lg block">관리자 로그인</button>
    </form>

    <p class="auth-foot"><a th:href="@{/member/login}">직원 로그인으로 돌아가기</a></p>
</main>
</div>
</body>
</html>
