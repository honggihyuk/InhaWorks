<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>관리자와 채팅하기</title></head>
<body>
<nav layout:fragment="crumbs" class="crumbs" aria-label="현재 위치"><span>InhaWorks</span><span class="sep">›</span><a th:href="@{/chat}">채팅</a><span class="sep">›</span><b>관리자와 채팅하기</b></nav>

<main layout:fragment="content" class="content narrow">
    <div class="page-header"><div>
        <h1 class="page-title">관리자와 채팅하기</h1>
        <p class="page-sub">주제를 고르면 나와 그 주제 담당자만 보는 대화방이 열려요</p>
    </div></div>
    <div th:if="${#lists.isEmpty(topics)}" class="card empty"><b>아직 문의 주제가 없어요</b><span>관리자가 주제를 만들면 여기에 보여요</span></div>
    <div class="stack" style="gap:10px">
        <form th:each="t : ${topics}" th:action="@{|/chat/inquiry/${t.id}|}" method="post" data-once>
            <button type="submit" class="card inquiry-topic">
                <span class="inquiry-icon" aria-hidden="true" th:text="${t.icon != null ? t.icon : '💬'}">💬</span>
                <span><b th:text="${t.name}">인사 문의</b><small th:text="${t.description}">급여, 휴가, 출퇴근</small></span>
                <span class="faint" aria-hidden="true">›</span>
            </button>
        </form>
    </div>
</main>
</body>
</html>
