<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>월별 스케줄</title></head>
<body>
<nav layout:fragment="crumbs" class="crumbs" aria-label="현재 위치"><span>우리 회사</span><span class="sep">›</span><span>스케줄</span><span class="sep">›</span><b>월별</b></nav>

<main layout:fragment="content" class="content">
    <div class="page-header">
        <div>
            <h1 class="page-title">스케줄</h1>
            <p class="page-sub" th:text="|${#temporals.format(cal.month().atDay(1), 'yyyy년 M월')} · 근무 ${cal.total()}일|">2026년 11월</p>
        </div>
        <div class="actions">
            <a th:href="@{/schedule/month(month=${cal.prev()})}" class="btn">‹ 지난달</a>
            <a th:href="@{/schedule/month}" class="btn">이번 달</a>
            <a th:href="@{/schedule/month(month=${cal.next()})}" class="btn">다음 달 ›</a>
        </div>
    </div>

    <section th:replace="~{attendance/my-policy :: card(${myPolicy}, null)}"></section>

    <div class="row" style="justify-content:flex-end">
        <nav class="segmented" aria-label="보기">
            <a th:href="@{/schedule(week=${cal.month().atDay(1)})}">주별</a>
            <a th:href="@{/schedule/month(month=${cal.month()})}" class="active" aria-current="page">월별</a>
        </nav>
    </div>

    <section class="card flush">
        <div class="table-box scroll-x">
            <table class="month-cal">
                <thead><tr><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th><th>일</th></tr></thead>
                <tbody>
                <tr th:each="week : ${cal.weeks()}">
                    <td th:each="d : ${week}" th:classappend="|${d.inMonth() ? '' : 'out'} ${d.today() ? 'today' : ''}|"
                        th:attr="aria-current=${d.today()} ? 'date'">
                        <div class="dnum"><span th:text="${d.date().dayOfMonth}">1</span></div>
                        <span class="shift-pill" th:each="s : ${d.schedules()}" th:classappend="${s.toneCss}">
                            <b th:text="${s.label}">오픈</b><span class="tnum" th:text="${s.timeText}">06:00–12:00</span></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
