<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title th:text="${post.title}">글</title></head>
<body>
<nav layout:fragment="crumbs" class="crumbs" aria-label="현재 위치"><span>우리 회사</span><span class="sep">›</span><a th:href="@{/board}">게시판</a><span class="sep">›</span>
    <a th:href="@{|/board/${post.board.id}|}" th:text="${post.board.name}">사내 공지</a><span class="sep">›</span><b th:text="${post.title}">제목</b></nav>

<main layout:fragment="content" class="content narrow">
    <article class="card stack" style="gap:16px">
        <div>
            <div class="row" style="gap:6px">
                <span class="chip solid" th:if="${post.pinned}">공지</span>
                <th:block th:if="${post.issueStatus != null}"><span th:replace="~{fragments/ui :: chip(${post.issueStatus.name()}, ${post.issueStatus.label})}"></span></th:block>
            </div>
            <h1 class="page-title" style="font-size:26px;margin-top:8px" th:text="${post.title}">제목</h1>
            <div class="row" style="margin-top:12px;justify-content:space-between">
                <span class="person" style="font-weight:500">
                    <span th:replace="~{fragments/ui :: avatar(${post.author}, 'sm')}"></span>
                    <span class="muted" th:text="|${post.author != null ? post.author.displayName : '알 수 없음'} · ${#temporals.format(post.created, 'yyyy.M.d HH:mm')} · 조회 ${post.viewCount}|">김민수</span>
                </span>
                <div class="actions">
                    <form sec:authorize="hasRole('ADMIN')" th:action="@{|/board/post/${post.id}/pin|}" method="post" class="inline">
                        <button type="submit" class="btn sm" th:text="${post.pinned} ? '고정 풀기' : '공지로 고정'">고정</button>
                    </form>
                    <a th:if="${canEdit}" th:href="@{|/board/post/${post.id}/edit|}" class="btn sm">수정</a>
                    <form th:if="${canEdit}" th:action="@{|/board/post/${post.id}/delete|}" method="post" class="inline">
                        <button type="submit" class="btn sm danger" data-confirm="이 글을 삭제할까요?" data-confirm-body="댓글과 첨부도 함께 지워지고, 되돌릴 수 없어요."
                                data-confirm-ok="삭제" data-danger>삭제</button>
                    </form>
                </div>
            </div>
        </div>
        <hr style="border:0;border-top:1px solid #EDF0F4;margin:0">
        <div class="post-body" th:text="${post.content}">내용</div>
        <ul class="files" th:unless="${#lists.isEmpty(post.files)}">
            <li th:each="f : ${post.files}"><a th:href="${f.path}" th:text="|📎 ${f.originalName}|" download>첨부.pdf</a></li>
        </ul>
    </article>

    <!-- 이슈 & 해결 : 상태 + 해결 방법 -->
    <section th:if="${post.board.issueBoard}" class="card soft" aria-labelledby="res-title">
        <div class="card-head"><h2 id="res-title">해결 방법</h2>
            <span class="meta" th:if="${post.resolvedAt != null}" th:text="|해결 ${#temporals.format(post.resolvedAt, 'yyyy.M.d HH:mm')}|">해결</span></div>
        <div class="post-body" style="min-height:0;margin-bottom:14px" th:text="${post.resolution != null ? post.resolution : '아직 정리된 해결 방법이 없어요.'}">해결</div>
        <form th:action="@{|/board/post/${post.id}/issue|}" method="post" class="stack" style="gap:10px">
            <label class="sr-only" for="resolution">해결 방법</label>
            <textarea id="resolution" name="resolution" class="textarea" placeholder="해결 방법 (해결로 바꿀 때 필수)" th:text="${post.resolution}"></textarea>
            <div class="row">
                <label class="sr-only" for="istatus">상태</label>
                <select id="istatus" name="status" class="select" style="max-width:180px">
                    <option th:each="s : ${issueStatuses}" th:value="${s}" th:text="${s.label}" th:selected="${post.issueStatus == s}">미해결</option>
                </select>
                <button type="submit" class="btn primary">상태 저장</button>
            </div>
        </form>
    </section>

    <div th:replace="~{fragments/ui :: comments(${comments}, @{|/board/post/${post.id}/comment|})}"></div>
</main>
</body>
</html>
