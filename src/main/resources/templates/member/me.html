<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head><title>내 정보</title></head>
<body>
<nav layout:fragment="crumbs" class="crumbs" aria-label="현재 위치"><span>InhaWorks</span><span class="sep">›</span><b>내 정보</b></nav>

<main layout:fragment="content" class="content narrow" th:with="m=${loginMember}">
    <h1 class="page-title">내 정보</h1>
    <section class="card stack" style="gap:20px;max-width:520px">
        <div class="row" style="gap:18px">
            <span th:replace="~{fragments/ui :: avatar(${m}, 'lg')}"></span>
            <div>
                <div style="font-size:20px;font-weight:700" th:text="${m.displayName}">홍기혁</div>
                <div class="muted" th:text="${m.subtitle}">영업팀 · 인하점 · 사원</div>
                <div class="row" style="gap:6px;margin-top:6px"><span class="mono muted" th:text="${m.username}">emp1</span><span class="chip blue" th:text="${m.role?.label}">직원</span></div>
            </div>
        </div>
        <div class="row">
            <form th:action="@{/me/photo}" method="post" enctype="multipart/form-data" class="inline">
                <label class="btn soft" style="cursor:pointer">사진 바꾸기
                    <input type="file" name="photo" accept="image/*" hidden onchange="this.form.submit()"></label>
            </form>
            <form th:if="${m.photoPath != null}" th:action="@{/me/photo/delete}" method="post" class="inline">
                <button type="submit" class="btn" data-confirm="프로필 사진을 지울까요?" data-confirm-ok="지우기" data-danger>사진 지우기</button>
            </form>
        </div>
        <hr style="border:0;border-top:1px solid #EDF0F4;margin:0">
        <form sec:authorize="hasRole('ADMIN')" th:action="@{/admin/logout}" method="post"><button type="submit" class="btn block">로그아웃</button></form>
        <form sec:authorize="!hasRole('ADMIN')" th:action="@{/member/logout}" method="post"><button type="submit" class="btn block">로그아웃</button></form>
    </section>
</main>
</body>
</html>
