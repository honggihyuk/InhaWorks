<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>로그인 · InhaWorks</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<!-- 직원 로그인 : POST /member/login 은 Spring Security 가 처리한다 (input 이름은 username, password)
     th:action 을 쓰면 CSRF 토큰이 hidden 으로 자동 추가된다 -->
<body class="ui auth-page">
<main class="auth-card">
    <div class="brand"><span class="brand-mark">I</span>InhaWorks</div>
    <h1 class="auth-title">로그인</h1>
    <p class="muted">출퇴근 · 할 일 · 보고서 · 게시판을 한곳에서</p>

    <div th:if="${param.error}" class="alert danger" role="alert">사용자ID 또는 비밀번호를 확인해 주세요. (퇴사 처리된 계정은 로그인할 수 없어요)</div>
    <div th:if="${param.logout}" class="alert info" role="status">로그아웃되었습니다.</div>

    <form th:action="@{/member/login}" method="post" class="stack" style="gap:14px">
        <div class="field"><label for="username">사용자ID</label>
            <input type="text" name="username" id="username" class="input" placeholder="아이디" autocomplete="username" required autofocus></div>
        <div class="field"><label for="password">비밀번호</label>
            <input type="password" name="password" id="password" class="input" placeholder="비밀번호" autocomplete="current-password" required></div>
        <button type="submit" class="btn primary lg block">로그인</button>
    </form>

    <p class="auth-foot">계정은 관리자가 만들어 드려요. 비밀번호를 잊었다면 관리자에게 문의하세요.</p>
    <p class="auth-foot"><a th:href="@{/admin/login}">관리자 로그인</a></p>
</main>
</body>
</html>
